name: Build Exhxx VPN Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # الضربة القاضية: تحويل كود Go إلى محرك أندرويد بصيغة AAR وحقنه بالتطبيق
    - name: Compile Go Engine (libv2ray.aar)
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init
        
        # إنشاء مجلد المكتبات داخل التطبيق
        mkdir -p V2rayNG/app/libs
        
        # الدخول لمجلد المحرك وبناؤه
        cd V2rayNG/libv2ray
        go mod download
        gomobile bind -v -androidapi 21 -target=android -javapkg=libv2ray -o ../app/libs/libv2ray.aar .

    - name: Build APK with Global Gradle
      run: gradle assembleDebug
      working-directory: V2rayNG

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Exhxx-VPN-Core-APK
        path: V2rayNG/app/build/outputs/apk/*/debug/*.apk
