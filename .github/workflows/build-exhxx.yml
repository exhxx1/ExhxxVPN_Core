name: Build Exhxx VPN Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive' # مهم جداً لسحب محركات فك التشفير

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21' # لغة Go المطلوبة لمحرك Xray

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK (Assemble Debug)
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Exhxx-VPN-Core-APK
        path: app/build/outputs/apk/*/debug/*.apk
