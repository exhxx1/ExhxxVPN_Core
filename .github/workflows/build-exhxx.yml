name: Build Exhxx VPN Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Go (Stable)
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # الضربة القاضية: تحديث مكتبة الشبكات المعطوبة والبناء للمحرك المتطابق
    - name: Compile Exact Go Engine (ARM64 Only)
      run: |
        export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | tail -1)
        
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init
        
        # 1. الدخول للمحرك الأصلي المتطابق مع التطبيق (بدون حذفه!)
        mkdir -p V2rayNG/app/libs
        cd V2rayNG/libv2ray
        
        # 2. تحديث مكتبة الشبكات لإصلاح خطأ (zoneCache) مع الإصدارات الحديثة
        go get github.com/wlynxg/anet@latest
        go mod tidy
        
        # 3. البناء لمعمارية جهازك فقط
        gomobile bind -v -androidapi 21 -target=android/arm64 -javapkg=libv2ray -o ../app/libs/libv2ray.aar .

    - name: Force Gradle to build ARM64
      run: |
        sed -i 's/abiFilters.addAll.*/abiFilters.addAll(arrayOf("arm64-v8a"))/g' V2rayNG/app/build.gradle.kts || true

    - name: Build APK with Global Gradle
      run: gradle assembleDebug
      working-directory: V2rayNG

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Exhxx-VPN-arm64
        path: V2rayNG/app/build/outputs/apk/*/debug/*.apk
