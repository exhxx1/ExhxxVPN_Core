name: Build Exhxx VPN Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # إعطاء صلاحية التشغيل للملف الذكي بداخل مجلد V2rayNG
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: V2rayNG

    # تشغيل البناء باستخدام الملف الذكي ليقوم بتحميل النسخة المتوافقة تلقائياً
    - name: Build APK with Wrapper
      run: ./gradlew assembleDebug
      working-directory: V2rayNG

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Exhxx-VPN-Core-APK
        path: V2rayNG/app/build/outputs/apk/*/debug/*.apk
