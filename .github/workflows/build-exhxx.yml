name: Build Exhxx VPN Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # الضربة الذكية: سحب المحرك الجاهز برابط مباشر من الشركة ووضعه بالتطبيق
    - name: Download Pre-compiled Engine (libv2ray.aar)
      run: |
        mkdir -p V2rayNG/app/libs
        echo "Downloading libv2ray.aar engine..."
        curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

    - name: Build APK with Global Gradle
      run: gradle assembleDebug
      working-directory: V2rayNG

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Exhxx-VPN-Core-APK
        path: V2rayNG/app/build/outputs/apk/*/debug/*.apk
